<!DOCTYPE html>
<html>
<head>
    <title>Introduction to CSS</title>

   
    <link rel="stylesheet" href="style.css">

   
    <style>
       
        * {
            margin: 0;
            padding: 0;
        }

       
        p {
            font-size: 18px;
            color: green;
        }

       
        .highlight {
            background-color: yellow;
            font-family: Arial, sans-serif;
        }
    </style>
</head>

<body>

    
    <h1 id="mainTitle">Welcome to CSS Lab</h1>

   
    <h2 style="color: blue; text-align: center;">
        This is styled using Inline CSS
    </h2>

    <p>This paragraph is styled using an element selector.</p>

    <p class="highlight">
        This paragraph uses a class selector.
    </p>

</body>
</html>
